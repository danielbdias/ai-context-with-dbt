[project]
name = "el"
version = "0.1.0"
description = "el member of the ai-context-with-dbt demo."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dlt[clickhouse,postgres,sql-database]==1.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el"]
