[project]
name = "ai-context-with-dbt"
version = "0.1.0"
description = "ELT demo: Postgres, dlt, Snowflake, dbt v2, dbt MCP and the Semantic Layer."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/web", "apps/el", "transform"]
# Own locks, own images: see dashboard/*/pyproject.toml.
exclude = ["dashboard/charts"]

[tool.uv.sources]
web = { workspace = true }
el = { workspace = true }
transform = { workspace = true }

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "clickhouse-connect>=1.11.0",
    "httpx>=0.28.1",
    "mcp>=1.30.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "D", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "D"]
"scripts/e2e/**" = ["S608", "D"]

[tool.ruff.lint.isort]
# The repo's `mcp/` folder holds client config, not Python: `mcp` is the SDK.
known-third-party = ["mcp"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = [
    "apps/web/tests",
    "apps/el/tests",
    "transform/tests",
]
addopts = "-ra -m 'not integration and not e2e'"
pythonpath = ["."]
markers = [
    "integration: needs real containers (deselected by default)",
    "e2e: runs against the isolated aictx-e2e compose project (task e2e)",
]
