[project]
name = "ai-context-with-dbt"
version = "0.1.0"
description = "Local ELT demo: Postgres, dlt, ClickHouse, dbt v2, dbt MCP."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/web", "apps/el", "transform"]

[tool.uv.sources]
web = { workspace = true }
el = { workspace = true }
transform = { workspace = true }

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "D", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["apps/web/tests", "apps/el/tests", "transform/tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs real containers (deselected by default)"]
