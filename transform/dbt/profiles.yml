# Every value comes from the environment, so no secret lives in git.
# Targets resolve refs identically. They differ only in who connects:
#   dev, ci  -> dbt_runner (builds staging and marts)
#   mcp      -> mcp_reader (read-only, marts)
#   charts   -> charts_reader (read-only, marts)
# Users, roles and warehouses come from infra/snowflake/setup.sql. A dbt platform
# project ignores this file and uses its own connection settings.
aictx:
  target: dev
  outputs:
    dev: &runner
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AICTX') }}"
      user: DBT_RUNNER
      password: "{{ env_var('SNOWFLAKE_DBT_RUNNER_PASSWORD', '') }}"
      role: AICTX_DBT_RUNNER
      warehouse: AICTX_TRANSFORM_WH
      schema: staging
      threads: 4
    ci: *runner
    mcp:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AICTX') }}"
      user: MCP_READER
      password: "{{ env_var('SNOWFLAKE_MCP_READER_PASSWORD', '') }}"
      role: AICTX_MCP_READER
      warehouse: AICTX_READ_WH
      schema: marts
      threads: 2
    charts:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AICTX') }}"
      user: CHARTS_READER
      password: "{{ env_var('SNOWFLAKE_CHARTS_READER_PASSWORD', '') }}"
      role: AICTX_CHARTS_READER
      warehouse: AICTX_READ_WH
      schema: marts
      # The 30 s query cap lives on the reader users and warehouse (setup.sql).
      threads: 2
