[project]
name = "transform"
version = "0.1.0"
description = "transform member of the ai-context-with-dbt demo."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbt==2.0.8",
    "dbt-mcp==2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transform"]
